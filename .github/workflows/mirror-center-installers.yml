name: Mirror verified center installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to mirror (without v)
        required: true
        default: '1.1.13'
      verification_file:
        description: Optional versioned verification report filename
        required: false
      payloads_only:
        description: Mirror portable and Linux payloads only
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: mirror-center-installers
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and verify exact center files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERIFICATION_FILE: ${{ inputs.verification_file }}
          PAYLOADS_ONLY: ${{ inputs.payloads_only }}
        run: node scripts/mirror-center-installers.mjs
      - name: Mirror Windows and Linux assets, preserving macOS payloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
          PAYLOADS_ONLY: ${{ inputs.payloads_only }}
        run: |
          set -euo pipefail
          gh release view "v$RELEASE_VERSION"
          gh api "repos/$GH_REPO/releases/tags/v$RELEASE_VERSION" > existing-release.json
          shopt -s nullglob
          for file in mirrored/*.exe mirrored/*.AppImage mirrored/*.deb mirrored/*.blockmap mirrored/release-verification-*.json; do
            name=$(basename "$file")
            actual="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            previous=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' existing-release.json)
            if [ "$actual" = "$previous" ]; then echo "Already verified: $name"; continue; fi
            gh release upload "v$RELEASE_VERSION" "$file" --clobber
          done
          if [ "$PAYLOADS_ONLY" != true ]; then
            gh release upload "v$RELEASE_VERSION" mirrored/release-notes.json mirrored/latest.yml mirrored/latest-linux.yml --clobber
            gh release edit "v$RELEASE_VERSION" --title "端砚· Science Discovery $RELEASE_VERSION（macOS / Windows / Linux）" --notes-file mirror-notes.md
          fi
      - name: Refresh Pages index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run refresh-pages-releases.yml
